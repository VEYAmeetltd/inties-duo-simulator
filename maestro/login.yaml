appId: com.intiesltd.inties
---
# Signs in with the App Review demo account. REVIEW_EMAIL and REVIEW_PASSWORD
# come from GitHub secrets; nothing is stored in this file.
- launchApp
- extendedWaitUntil:
    visible:
      id: "cta-login"
    timeout: 90000
- takeScreenshot: out/maestro/01-welcome
- tapOn:
    id: "cta-login"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- takeScreenshot: out/maestro/02-sign-in
- tapOn:
    id: "login-email"
- inputText: ${REVIEW_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${REVIEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    notVisible:
      id: "login-submit"
    timeout: 60000
# iOS may offer to save the password; decline it.
- tapOn:
    text: "Not Now"
    optional: true
# The Meet Tye tutorial opens on first sign-in; skip it if it appears.
- tapOn:
    text: "No thanks, I.ll explore myself"
    optional: true
- tapOn:
    text: "Skip tutorial"
    optional: true
