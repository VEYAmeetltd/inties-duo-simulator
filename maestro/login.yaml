appId: com.intiesltd.inties
---
# Signs in with the App Review demo account. REVIEW_EMAIL and REVIEW_PASSWORD
# come from GitHub secrets; nothing is stored in this file.
- launchApp
- extendedWaitUntil:
    visible:
      id: "cta-login"
    timeout: 90000
- takeScreenshot: out/maestro/01-welcome
- tapOn:
    id: "cta-login"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- takeScreenshot: out/maestro/02-sign-in
- tapOn:
    id: "login-email"
- inputText: ${REVIEW_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${REVIEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    notVisible:
      id: "login-submit"
    timeout: 60000
# iOS offers to save the password in a system sheet that Maestro can't read,
# so tap its "Not Now" button by position (outer display, measured from run 3).
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    point: "28%,63%"
- waitForAnimationToEnd:
    timeout: 4000
# The Meet Tye tutorial opens on first sign-in; skip it if it appears.
- tapOn:
    text: "No thanks, I.ll explore myself"
    optional: true
- tapOn:
    text: "Skip tutorial"
    optional: true
# If the text taps didn't match (run 4), tap "No thanks, I'll explore myself"
# by position on the Meet Tye card (outer display, measured from run 4).
- tapOn:
    point: "43%,93%"
- waitForAnimationToEnd:
    timeout: 4000
# The Meet Tye card sometimes appears a few seconds later (run 6), so wait and
# tap its "No thanks" spot once more. If the card isn't there this lands on the
# tab bar, which is harmless because each screen is opened by link afterwards.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: "43%,93%"
- waitForAnimationToEnd:
    timeout: 3000
