name: iPhone Duo simulator

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Link to the INTIES simulator build (.tar.gz from Expo)"
        required: true
      minutes:
        description: "How long to keep the phone running (minutes, max 55)"
        required: false
        default: "30"
      xcode:
        description: "Xcode version to use"
        required: false
        default: "27.2"

concurrency:
  group: duo-simulator
  cancel-in-progress: false

jobs:
  duo:
    # GitHub's Apple Silicon Mac with Xcode 27; it includes the iPhone Duo simulator.
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run INTIES on the iPhone Duo and share a browser link
        env:
          APP_URL: ${{ inputs.app_url }}
          MINUTES: ${{ inputs.minutes }}
          XCODE_VERSION: ${{ inputs.xcode }}
        run: |
          if [ "${MINUTES:-30}" -gt 55 ]; then export MINUTES=55; fi
          bash scripts/duo-session.sh

      - name: Save screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-session
          path: out/
          retention-days: 14
